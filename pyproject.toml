[project]
name = "swift-code-graph"
version = "0.1.0"
description = "Turn a Swift codebase into a knowledge graph you can query and fly through"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["swift", "ios", "code-graph", "static-analysis", "tree-sitter", "visualization"]
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyvis>=0.3.2",
    "tree-sitter>=0.25.2",
    "tree-sitter-language-pack>=1.8.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
swiftgraph-build = "swiftgraph.build_graph:main"
swiftgraph-2d = "swiftgraph.viz2d:main"
swiftgraph-3d = "swiftgraph.viz3d:main"
swiftgraph-query = "swiftgraph.query:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swiftgraph"]
